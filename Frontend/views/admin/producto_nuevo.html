<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Nuevo Producto - Doble L</title>
    <link rel="stylesheet" href="../../public/css/estiloAdmin.css">
    <style>
        .api-container {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .api-container input {
            flex: 1;
            margin-bottom: 0 !important;
        }

        .btn-api {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.9em;
        }

        .btn-api:hover {
            background-color: #218838;
        }

        .tasa-info {
            font-size: 0.85em;
            color: #666;
            margin-bottom: 15px;
            display: block;
            font-style: italic;
        }
    </style>
</head>

<body>

    <header class="header-admin">
        <div class="contenedor-header">
            <a href="menuAdministrador.html">
                <img src="https://comercializadorall.grupoctic.com/ComercializadoraLL/img/whitelogo.png" alt="Logo"
                    class="logo">
            </a>
            <nav class="nav-admin">
                <a href="menuAdministrador.html">Productos</a>
                <a href="ventas.html">Ventas</a>
                <a href="compra.html">Compras</a>
                <a href="categorias.html">Categorías</a>
                <a href="marcas.html">Marcas</a>
                <a href="proveedores.html">Proveedores</a>
                <a href="listaSucursales.html">Sucursales</a>
                <a href="informacionEmpresa.html">Información</a>
                <a href="clientes.html">Clientes</a>
                <a href="preguntasFrecuentes.html">FAQ</a>
                <a href="contactoLista.html">Contacto</a>
                <a href="usuarios.html">Usuarios</a>
            </nav>
            <div class="user-menu">
                <img src="https://comercializadorall.grupoctic.com/ComercializadoraLL/img/profileicon.jpg" alt="Perfil"
                    class="profileicon">
                <div class="menu" id="menu-usuario-admin">
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <main class="main">
            <form id="form-nuevo-producto" class="panelP-formularioProductos">
                <h2>Registrar nuevo producto</h2>

                <label for="vchNo_Serie">Número de serie:</label>
                <input type="text" id="vchNo_Serie" name="vchNo_Serie" placeholder="Ej. SMART-001"
                    pattern="[A-Za-z0-9\-]+" required>

                <label for="vchNombre">Nombre:</label>
                <input type="text" id="vchNombre" name="vchNombre" placeholder="Nombre comercial del producto"
                    pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s0-9]+" required>

                <label for="vchDescription">Descripción:</label>
                <textarea id="vchDescripcion" name="vchDescripcion" rows="3"
                    placeholder="Detalles técnicos, color, modelo..."></textarea>

                <label for="floPrecioCompra">Precio de compra:</label>
                <input type="number" step="0.01" min="0" id="floPrecioCompra" name="floPrecioCompra" placeholder="0.00"
                    required>

                <label for="floPrecioUnitario">Precio de venta:</label>
                <input type="number" step="0.01" min="0" id="floPrecioUnitario" name="floPrecioUnitario"
                    placeholder="0.00" required>

                <label for="intStock">Stock inicial:</label>
                <input type="number" step="1" min="0" id="intStock" name="intStock" value="0">

                <label for="intid_Categoria">Categoría:</label>
                <select id="intid_Categoria" name="intid_Categoria" required>
                    <option value="">-- Cargando categorías... --</option>
                </select>

                <label for="intid_Marca">Marca:</label>
                <select id="intid_Marca" name="intid_Marca" required>
                    <option value="">-- Cargando marcas... --</option>
                </select>

                <label for="vchImagen">Imagen del producto:</label>
                <input type="file" id="vchImagen" name="vchImagen" accept="image/png, image/jpeg, image/webp"
                    onchange="validarImagenNueva(this);" required>
                <div class="botones">
                    <button type="submit" class="guardar">Guardar</button>
                    <button type="button" class="cancelar"
                        onclick="window.location.href='menuAdministrador.html'">Cancelar</button>
                </div>
            </form>
        </main>
    </div>

    <footer>
        <div class="linksFooter">
            <a>© 2026 Comercializadora Doble L — Sistema de Ventas</a>
        </div>
    </footer>
    <script src="../../public/js/authAdmin.js"></script>
    <script src="../../public/js/producto_nuevo.js"></script>
    <script>
        function validarImagenNueva(input) {
            const tiposPermitidos = ['image/jpeg', 'image/png', 'image/webp'];
            const archivo = input.files[0];

            if (!archivo) return;

            if (!tiposPermitidos.includes(archivo.type)) {
                alert('❌ Error: Solo se permiten imágenes (JPG, PNG o WEBP). Los archivos PDF u otros formatos no están permitidos.');
                input.value = "";
                return false;
            }

            if (archivo.size > 2 * 1024 * 1024) {
                alert('❌ Error: La imagen es demasiado pesada. El máximo permitido es 2MB.');
                input.value = "";
                return false;
            }
        }
    </script>
</body>

</html>
