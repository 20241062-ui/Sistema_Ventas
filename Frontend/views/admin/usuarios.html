<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>Gestión de Usuarios - Admin</title>
    <link rel="stylesheet" href="../../public/css/estiloAdmin.css">
    <style>
        .btn-eliminar {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-eliminar:hover {
            background-color: #a71d2a;
        }

        .acciones-flex {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
    </style>
</head>

<body>

    <header class="header-admin">
        <div class="contenedor-header">
            <a href="menuAdministrador.html"><img
                    src="https://comercializadorall.grupoctic.com/ComercializadoraLL/img/whitelogo.png" alt="Logo"
                    class="logo"></a>
            <nav class="nav-admin">
                <a href="menuAdministrador.html">Productos</a>
                <a href="ventas.html">Ventas</a>
                <a href="compra.html">Compras</a>
                <a href="categorias.html">Categorías</a>
                <a href="marcas.html">Marcas</a>
                <a href="proveedores.html">Proveedores</a>
                <a href="listaSucursales.html">Sucursales</a>
                <a href="informacionEmpresa.html">Información</a>
                <a href="clientes.html">Clientes</a>
                <a href="preguntasFrecuentes.html">FAQ</a>
                <a href="contactoLista.html">Contacto</a>
                <a href="usuarios.html" class="active">Usuarios</a>
            </nav>
            <div class="user-menu">
                <img src="https://comercializadorall.grupoctic.com/ComercializadoraLL/img/profileicon.jpg" alt="Perfil"
                    class="profileicon">
                <div class="menu" id="menu-usuario-admin">
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <main class="main">
            <h2>Usuarios del Sistema</h2>

            <div class="cards">
                <div class="card">
                    <h3>Total</h3>
                    <p class="big" id="countTotal">-</p>
                </div>
                <div class="card success">
                    <h3>Activos</h3>
                    <p class="big" id="countActivos">-</p>
                </div>
                <div class="card warning">
                    <h3>Inactivos</h3>
                    <p class="big" id="countInactivos">-</p>
                </div>
            </div>

            <div class="productos-superior">
                <button type="button" class="btn-superior"
                    onclick="window.location.href='usuario_formulario.html'">Nuevo Usuario</button>
                <form id="formBuscarUsuario" class="productos-buscar">
                    <input type="search" id="inputBuscar" placeholder="Buscar usuario (nombre, correo, rol)...">
                    <button type="submit" class="btn-superior buscar">🔍 Buscar</button>
                </form>
            </div>

            <div class="panel table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Correo</th>
                            <th>Rol</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaUsuariosBody">
                        <tr>
                            <td colspan="6" style="text-align:center;">Cargando usuarios...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <footer>
        <div class="linksFooter"><a>© 2026 FlashCode — Sistema de Gestión</a></div>
    </footer>
    <script src="../../public/js/authAdmin.js"></script>
    <script src="../../public/js/usuarios.js"></script>
</body>

</html>
