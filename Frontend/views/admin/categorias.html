<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>Categorías - Sistema de Ventas</title>
    <link rel="stylesheet" href="../../public/css/estiloAdmin.css">
</head>

<body>
    <header class="header-admin">
        <div class="contenedor-header">
            <a href="menuAdministrador.html">
                <img src="https://comercializadorall.grupoctic.com/ComercializadoraLL/img/whitelogo.png" alt="Logo"
                    class="logo">
            </a>

            <nav class="nav-admin">
                <a href="menuAdministrador.html">Productos</a>
                <a href="ventas.html">Ventas</a>
                <a href="compra.html">Compras</a>
                <a href="categorias.html" class="active">Categorías</a>
                <a href="marcas.html">Marcas</a>
                <a href="proveedores.html">Proveedores</a>
                <a href="listaSucursales.html">Sucursales</a>
                <a href="informacionEmpresa.html">Información</a>
                <a href="clientes.html">Clientes</a>
                <a href="preguntasFrecuentes.html">FAQ</a>
                <a href="contactoLista.html">Contacto</a>
                <a href="usuarios.html">Usuarios</a>
            </nav>

            <div class="user-menu">
                <img src="https://comercializadorall.grupoctic.com/ComercializadoraLL/img/profileicon.jpg" alt="Perfil"
                    class="profileicon">
                <div class="menu" id="menu-usuario-admin">
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <main class="main">
            <h2>Categorías registradas</h2>

            <div class="cards">
                <div class="card">
                    <h3>Total categorías</h3>
                    <p class="big" id="total-categorias">0</p>
                </div>
            </div>

            <div class="productos-superior">
                <button class="btn-superior" onclick="window.location.href='categoria_nueva.html'">Nueva
                    categoría</button>

                <div class="productos-buscar">
                    <input type="search" id="input-buscar" placeholder="Buscar por ID o nombre...">
                    <button type="button" id="btn-buscar" class="btn-superior buscar">🔍 Buscar</button>
                </div>
            </div>

            <div class="panel table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Categoría</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-categorias-body">
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <footer>
        <div class="linksFooter">
            <a>© 2026 Comercializadora Doble L — Sistema de Ventas</a>
        </div>
    </footer>
    <script src="../../public/js/authAdmin.js"></script>
    <script src="../../public/js/adminCategorias.js"></script>
</body>

</html>
