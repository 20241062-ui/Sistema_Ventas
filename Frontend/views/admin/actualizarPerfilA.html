<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil Admin - Doble L</title>
    <link rel="stylesheet" href="../../public/css/home.css">
    <link rel="stylesheet" href="../../public/css/perfil.css">

</head>

<body>

    <header>
        <div class="contenedor-header">
            <a href="menuAdministrador.html">
                <img src="https://comercializadorall.grupoctic.com/ComercializadoraLL/img/whitelogo.png" alt="Logo"
                    class="logo">
            </a>

            <nav class="nav-admin">
                <a href="menuAdministrador.html">Productos</a>
                <a href="ventas.html">Ventas</a>
                <a href="compra.html">Compras</a>
                <a href="categorias.html">Categorías</a>
                <a href="marcas.html">Marcas</a>
                <a href="proveedores.html">Proveedores</a>
                <a href="listaSucursales.html">Sucursales</a>
                <a href="informacionEmpresa.html">Información</a>
                <a href="clientes.html">Clientes</a>
                <a href="preguntasFrecuentes.html">FAQ</a>
                <a href="contactoLista.html">Contacto</a>
                <a href="usuarios.html">Usuarios</a>
            </nav>

            <div class="user-menu">
                <div class="menu" id="menu-usuario-admin"></div>
            </div>
        </div>
    </header>

    <main>
        <div class="perfil-container">

            <div class="perfil-menu">
                <h2>Mi cuenta (Admin)</h2>
                <p id="lateral-info-edit">Cargando...</p>
                <a href="perfilAdmin.html">Mis datos</a>
                <a href="actualizarPerfilA.html">Editar información</a>
                <a href="#" id="btn-logout-edit">Cerrar Sesión</a>
            </div>

            <div class="perfil-info">
                <h3>Editar información de Administrador</h3>

                <form id="form-actualizar-perfil">

                    <label for="vchnombre">Nombre(s):</label>
                    <input type="text" name="vchnombre" id="vchnombre" pattern="^[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+$" required
                        placeholder="Nombre">

                    <label for="vchapellidoP">Apellido Paterno:</label>
                    <input type="text" name="vchapellidoP" id="vchapellidoP" pattern="^[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+$"
                        required placeholder="Apellido Paterno">

                    <label for="vchapellidoM">Apellido Materno:</label>
                    <input type="text" name="vchapellidoM" id="vchapellidoM" pattern="^[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+$"
                        placeholder="Apellido Materno">

                    <label>Correo (No editable):</label>
                    <input type="email" id="vchcorreo-display" readonly
                        style="background-color: #eee; cursor: not-allowed;" placeholder="correo@ejemplo.com">

                    <label for="vchpassword">Nueva Contraseña (dejar vacío si no deseas cambiarla):</label>
                    <input type="password" name="vchpassword" id="vchpassword" placeholder="••••••••">

                    <div class="botones">
                        <button type="submit" class="btn">Guardar cambios</button>
                        <button type="button" class="btn btn-cancelar"
                            onclick="window.location.href='perfilAdmin.html'">Cancelar</button>
                    </div>

                </form>
            </div>
        </div>
    </main>

    <footer>
        <div class="linksFooter">
            © 2026 Comercializadora Doble L — Sistema de Ventas
        </div>
    </footer>

    <script src="../../public/js/authAdmin.js"></script>
</body>

</html>
