</head>

<body>
    <header class="header-admin">
        <div class="contenedor-header">
            <a href="menuAdministrador.html"><img
                    src="https://comercializadorall.grupoctic.com/ComercializadoraLL/img/whitelogo.png" alt="Logo"
                    class="logo"></a>
            <nav class="nav-admin">
                <a href="menuAdministrador.html">Productos</a>
                <a href="ventas.html">Ventas</a>
                <a href="compra.html">Compras</a>
                <a href="categorias.html">Categorías</a>
                <a href="marcas.html">Marcas</a>
                <a href="proveedores.html">Proveedores</a>
                <a href="listaSucursales.html">Sucursales</a>
                <a href="informacionEmpresa.html">Información</a>

                <a href="contactoLista.html" class="active">Contacto</a>
                <a href="usuarios.html">Usuarios</a>
            </nav>
            <div class="user-menu">
                <img src="https://comercializadorall.grupoctic.com/ComercializadoraLL/img/profileicon.jpg" alt="Perfil"
                    class="profileicon">
                <div class="menu" id="menu-usuario-admin">
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <main class="main">
            <h2>Información de Contacto</h2>

            <div class="productos-superior">
                <button class="btn-superior" onclick="window.location.href='contacto_formulario.html'">Nuevo
                    contacto</button>
                <form id="formBuscarContacto" class="productos-buscar">
                    <input type="search" id="inputBuscar" placeholder="Buscar por ID, campo o valor...">
                    <button type="submit" class="btn-superior buscar">🔍 Buscar</button>
                </form>
            </div>

            <div class="panel table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Campo</th>
                            <th>Valor</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaContactoBody">
                        <tr>
                            <td colspan="4" style="text-align:center;">Cargando información de contacto...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <footer>
        <div class="linksFooter"><a>© 2026 Comercializadora Doble L — Sistema de Ventas</a></div>
    </footer>
