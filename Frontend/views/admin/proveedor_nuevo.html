    <form class="panelP-formularioProductos" action="proveedores.html" method="GET">
        <h2>Registrar nuevo proveedor</h2>

        <label for="vchRFC">RFC:</label>
        <input type="text" id="vchRFC" name="vchRFC" pattern="[A-ZÑ&]{3,4}[0-9]{6}[A-Z0-9]{3}" maxlength="13"
            placeholder="Ej: ABCD001122XX1" required>

        <label for="vchNombre">Nombre:</label>
        <input type="text" id="vchNombre" name="vchNombre" placeholder="Nombre o Nombre de Empresa"
            pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+" required>

        <label for="vchApellido_Paterno">Apellido Paterno:</label>
        <input type="text" id="vchApellido_Paterno" name="vchApellido_Paterno" pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+">

        <label for="vchApellido_Materno">Apellido Materno:</label>
        <input type="text" id="vchApellido_Materno" name="vchApellido_Materno" pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+">

        <label for="vchColonia">Colonia:</label>
        <input type="text" id="vchColonia" name="vchColonia" pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ0-9\s#.-]+">

        <label for="intNo_ExteriorInterior">No. Exterior / Interior:</label>
        <input type="number" id="intNo_ExteriorInterior" name="intNo_ExteriorInterior" min="0">

        <label for="vchCodigo_Postal">Código Postal:</label>
        <input type="text" id="vchCodigo_Postal" name="vchCodigo_Postal" pattern="[0-9]{5}" maxlength="5">

        <label for="vchCalle">Calle:</label>
        <input type="text" id="vchCalle" name="vchCalle" pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ0-9\s#.-]+">

        <label for="vchTelefono">Teléfono:</label>
        <input type="text" id="vchTelefono" name="vchTelefono" pattern="[0-9]{10}" maxlength="10">

        <label for="vchCorreo">Correo electrónico:</label>
        <input type="email" id="vchCorreo" name="vchCorreo" placeholder="proveedor@empresa.com">

        <label for="vchRazon_Social">Razón Social:</label>
        <input type="text" id="vchRazon_Social" name="vchRazon_Social" placeholder="Nombre legal completo"
            pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ0-9\s#.&(),.-]+">

        <div class="botones">
            <button type="submit" class="guardar">Guardar</button>
            <button type="button" onclick="window.location.href='proveedores.html'" class="cancelar">Cancelar</button>
        </div>
    </form>

        </div>
