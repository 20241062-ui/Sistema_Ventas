<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Gestión de Información - Doble L</title>
    <link rel="stylesheet" href="../../public/css/estiloAdmin.css">
</head>

<body>

    <header class="header-admin">
        <div class="contenedor-header">
            <a href="menuAdministrador.html">
                <img src="https://comercializadorall.grupoctic.com/ComercializadoraLL/img/whitelogo.png" alt="Logo"
                    class="logo">
            </a>

            <nav class="nav-admin">
                <a href="menuAdministrador.html">Productos</a>
                <a href="ventas.html">Ventas</a>
                <a href="compra.html">Compras</a>
                <a href="categorias.html">Categorías</a>
                <a href="marcas.html">Marcas</a>
                <a href="proveedores.html">Proveedores</a>
                <a href="listaSucursales.html">Sucursales</a>
                <a href="informacionEmpresa.html" class="active">Información</a>
                <a href="clientes.html">Clientes</a>
                <a href="preguntasFrecuentes.html">FAQ</a>
                <a href="contactoLista.html">Contacto</a>
                <a href="usuarios.html">Usuarios</a>
            </nav>

            <div class="user-menu">
                <img src="https://comercializadorall.grupoctic.com/ComercializadoraLL/img/profileicon.jpg" alt="Perfil"
                    class="profileicon">
                <div class="menu" id="menu-usuario-admin">
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <main class="main">
            <form id="formInformacion" class="panelP-formularioProductos">

                <h2 id="tituloFormulario">Registrar Nueva Información</h2>

                <input type="hidden" name="intid" id="intid">

                <label for="vchtitulo">Título (Misión o Visión):</label>
                <input type="text" id="vchtitulo" name="vchtitulo" placeholder="Ej. Valores Corporativos" required>

                <label for="vchcontenido">Contenido:</label>
                <textarea id="vchcontenido" name="vchcontenido" rows="8"
                    placeholder="Escribe aquí el texto detallado..." required></textarea>

                <div class="botones">
                    <button type="submit" id="btnGuardar" class="guardar">Guardar</button>
                    <button type="button" class="cancelar"
                        onclick="window.location.href='informacionEmpresa.html'">Cancelar</button>
                </div>
            </form>
        </main>
    </div>

    <footer>
        <div class="linksFooter">
            <a>© 2026 Comercializadora Doble L — Sistema de Gestión</a>
        </div>
    </footer>
    <script src="../../public/js/authAdmin.js"></script>
    <script src="../../public/js/informacion.js"></script>
</body>

</html>
