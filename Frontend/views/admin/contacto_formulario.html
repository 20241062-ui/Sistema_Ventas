<!DOCTYPE html>

    <meta charset="utf-8">
    <title>Gestionar Contacto - Doble L</title>

</head>
<body>
    <header class="header-admin">
        <div class="contenedor-header">
            <a href="menuAdministrador.html"><img src="https://comercializadorall.grupoctic.com/ComercializadoraLL/img/whitelogo.png" alt="Logo" class="logo"></a>
           <nav class="nav-admin">
                <a href="menuAdministrador.html">Productos</a>
                <a href="ventas.html">Ventas</a>
                <a href="compra.html">Compras</a>
                <a href="categorias.html">Categorías</a>
                <a href="marcas.html">Marcas</a>
                <a href="proveedores.html" class="active">Proveedores</a>
                <a href="listaSucursales.html">Sucursales</a>
                <a href="informacionEmpresa.html">Información</a>
                <a href="clientes.html">Clientes</a>
                <a href="preguntasFrecuentes.html">FAQ</a>
                <a href="contactoLista.html">Contacto</a>
                <a href="usuarios.html">Usuarios</a>
            </nav>
            <div class="user-menu">
                <img src="https://comercializadorall.grupoctic.com/ComercializadoraLL/img/profileicon.jpg" alt="Perfil"
                    class="profileicon">
                <div class="menu" id="menu-usuario-admin">
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <main class="main">
            <form id="formContacto" class="panelP-formularioProductos">
                <h2 id="tituloFormulario">Nuevo Contacto</h2>
                <input type="hidden" id="intid">

                <div class="campo">
                <label for="vchcampo">Nombre del Campo (Ej: Teléfono, Email):</label>
                <input type="text" id="vchcampo" required placeholder="Ej: WhatsApp">
               

                <div class="campo">
                    <label for="vchvalor">Valor:</label>
                    <input type="text" id="vchvalor" required placeholder="Ej: +52 771...">
                </div>

                <div class="botones-form">
                    <button type="submit" class="guardar">Guardar Información</button>
                    <button type="button" class="cancelar" onclick="window.location.href='contactoLista.html'">Cancelar</button>
                </div>
            </form>
            
        </main>
    </div>

    <footer>
        <div class="linksFooter">
            <a>© 2026 Comercializadora Doble L — Sistema de Ventas</a>
        </div>
    </footer>
    <script src="../../public/js/authAdmin.js"></script>
    <script src="../../public/js/contacto_form.js"></script>
</body>
</html>
