<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Carrito - Comercializadora Doble L</title>
    <link rel="stylesheet" href="../../public/css/home.css">
</head>

<body>
    <header>
        <div class="contenedor-header">
            <a href="../index.html">
                <img src="https://comercializadorall.grupoctic.com/ComercializadoraLL/img/whitelogo.png" alt="Logo" class="logo">
            </a>
            <nav>
                <a href="../index.html" class="nav-link">Inicio</a>
                <a href="celulares.html?id=1" class="nav-link">Celulares</a>
                <a href="Accesorios.html?id=8" class="nav-link">Accesorios</a>
                <a href="Electrodomesticos.html?id=2" class="nav-link">Laptops</a>
            </nav>
            <div class="user-controls" style="display: flex; align-items: center;">
                <a href="carrito.html" class="cart-link">
                    <img src="https://cdn-icons-png.flaticon.com/512/107/107831.png" alt="Carrito" class="cart-icon-nav" style="filter: invert(1);">
                    <span id="cart-count">0</span>
                </a>
                <div class="user-menu">
                    <img src="https://comercializadorall.grupoctic.com/ComercializadoraLL/img/profileicon.jpg" alt="Perfil" class="profileicon">
                    <div class="menu" id="menu-usuario">
                        <a href="perfil.html" id="link-perfil">Mi cuenta</a>
                        <a href="../login.html" id="link-login">Iniciar Sesión</a>
                        <a href="#" id="link-logout" style="display: none;">Cerrar Sesión</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="carrito-main">
        <h1>Tu Carrito de Compras</h1>
        
        <div class="contenedor-carrito-unico">
            <section class="productos-container" id="lista-carrito">
                <p>Cargando productos...</p>
            </section>

            <div class="resumen-final-integrado">
                <h3>Resumen</h3>
                <hr>
                <div style="display: flex; justify-content: space-between; margin: 20px 0;">
                    <span>Total a pagar:</span>
                    <span id="cart-total" class="total-texto">$0.00</span>
                </div>
                <button id="btn-checkout" class="comprarproducto" style="width: 100%; padding: 15px;">
                    Finalizar Compra
                </button>
                <p id="msg-login" style="display:none; color: red; margin-top: 15px; text-align: center;">
                    Inicia sesión para completar tu compra.
                </p>
            </div>
        </div>
    </main>

    <footer>
        <div class="linksFooter">
            <a href="quienessomos.html"><h3>¿Quiénes somos?</h3></a>
            <a href="contactoPublico.html"><h3>Contacto</h3></a>
            <a href="ubicacion.html"><h3>Ubicación</h3></a>
            <a href="politicaCompra.html"><h3>Políticas</h3></a>
        </div>
    </footer>

    <script src="../../public/js/global-currency.js"></script>
    <script src="../../public/js/cart.js"></script>
    <script src="../../public/js/carrito-view.js"></script>
</body>

</html>
