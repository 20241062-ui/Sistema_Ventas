<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../public/css/home.css">
    <link rel="stylesheet" href="../../public/css/carrito.css">
    <title>Tu Bolsa - Comercializadora Doble L</title>
</head>
<body>
    <header>
        <div class="contenedor-header">
            <a href="../index.html"><img src="https://comercializadorall.grupoctic.com/ComercializadoraLL/img/whitelogo.png" class="logo"></a>
            <nav>
                <a href="../index.html" class="nav-link">Inicio</a>
            </nav>
        </div>
    </header>

    <main class="carrito-main">
        <header class="carrito-header">
            <h1 id="titulo-bolsa">Tu bolsa.</h1>
            <p>El envío es gratuito en todos los pedidos.</p>
        </header>

        <section id="items-carrito">
            </section>

        <section class="carrito-resumen" id="resumen-seccion" style="display: none;">
            <div class="resumen-linea">
                <span>Subtotal</span>
                <span id="subtotal">$0.00</span>
            </div>
            <div class="resumen-linea">
                <span>Envío</span>
                <span>Gratis</span>
            </div>
            <div class="resumen-linea total">
                <span>Total</span>
                <span id="total-final">$0.00</span>
            </div>
            <button class="btn-checkout">Pagar</button>
        </section>
    </main>

    <footer>
        <div class="linksFooter">
            <a href="#"><h3>Contacto</h3></a>
            <a href="#"><h3>Ubicación</h3></a>
        </div>
    </footer>

    <script src="../../public/js/carrito.js"></script>
</body>
</html>
