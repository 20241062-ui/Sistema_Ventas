<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../../public/css/home.css">
    <link rel="stylesheet" href="../../public/css/carrito.css">
    <title>Tu Bolsa de Compra - Comercializadora Doble L</title>
</head>
<body>
    <main class="carrito-main">
        <div class="carrito-container">
            <header class="carrito-header">
                <h1 id="titulo-bolsa">Tu bolsa está vacía.</h1>
                <p>El envío es gratuito en todos los pedidos.</p>
            </header>

            <div id="items-carrito">
            </div>

            <div class="carrito-resumen" id="resumen-seccion" style="display: none;">
                <div class="resumen-linea">
                    <span>Subtotal</span>
                    <span id="subtotal">$0.00</span>
                </div>
                <div class="resumen-linea">
                    <span>Envío</span>
                    <span>Gratis</span>
                </div>
                <div class="resumen-linea total">
                    <span>Total</span>
                    <span id="total-final">$0.00</span>
                </div>
                <button class="btn-checkout">Revisar pedido</button>
                <button class="btn-checkout" onclick="procesarPago()">Pagar ahora</button>
            </div>
        </div>
    </main>

    <script src="../../public/js/carrito.js"></script>
</body>
</html>
