<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Carrito - Comercializadora Doble L</title>
    <link rel="stylesheet" href="../css/home.css">
</head>

<body>
    <header>
        <div class="contenedor-header">
            <a href="../index.html">
                <img src="https://comercializadorall.grupoctic.com/ComercializadoraLL/img/whitelogo.png" alt="Logo" class="logo">
            </a>
            <nav>
                <a href="../index.html" class="nav-link">Volver al Inicio</a>
            </nav>
        </div>
    </header>

    <main class="carrito-container">
        <section class="lista-productos">
            <h2 style="margin-top: 0;">Tu Carrito</h2>
            <div id="lista-carrito">
                <p style="text-align: center;">Cargando productos...</p>
            </div>
        </section>

        <aside class="resumen-compra">
            <h3>Resumen de Pedido</h3>
            <div class="total-fila">
                <span>Subtotal</span>
                <span id="subtotal-precio">$0.00</span>
            </div>
            <div class="total-fila">
                <span>Envío</span>
                <span style="color: green; font-weight: bold;">Gratis</span>
            </div>
            <div class="total-fila total-final">
                <span>Total</span>
                <span id="cart-total">$0.00</span>
            </div>

            <button id="btn-checkout" class="btn-pagar">
                Finalizar Compra
            </button>
            
            <p id="msg-login">Debes iniciar sesión para finalizar la compra.</p>
        </aside>
    </main>

    <footer>
        <div class="linksFooter">
            <p>&copy; 2026 Comercializadora Doble L - Todos los derechos reservados</p>
        </div>
    </footer>

    <script src="../js/global-currency.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/carrito-view.js"></script>
</body>

</html>
